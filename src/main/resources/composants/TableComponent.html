<wicket:panel>
    <div class="table-responsive">
        <p wicket:id="noData">No data available</p>
        <table class="table">
            <thead>
                <tr>
                    <th wicket:id="headers">
                        <span wicket:id="header"></span>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr wicket:id="rows">
                    <td wicket:id="columns">
                        <a wicket:id="columnLink">
                            <span wicket:id="column"></span>
                        </a>
                        <span wicket:id="column"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</wicket:panel>
