<wicket:panel>
    <div class="contenerHeader">
        <header class="header">
            <!-- Logo -->
            <div class="logo">
                <span wicket:id="logo"></span>
            </div>

            <!-- Liens de navigation -->
            <nav class="nav-links">
                <a wicket:id="links">
                    <span wicket:id="linkLabel"></span>
                </a>
            </nav>
        </header>
    </div>
</wicket:panel>
