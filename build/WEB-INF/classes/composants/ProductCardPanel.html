<!-- src/main/resources/com/example/components/ProductCard.html -->
<wicket:panel>
    <div class="product-card">
        <div class="product-image">
            <img wicket:id="productImage" alt="Product Image">
        </div>
        <div class="product-details">
            <h3 wicket:id="productName" class="product-name"></h3>
            <p wicket:id="productPrice" class="product-price"></p>
            <a wicket:id="detailsLink" class="product-details-link">Voir les détails</a>
        </div>
    </div>
</wicket:panel>
